[project]
name = "falcon"
version = "0.1.0"
description = "Quadrotor flight with a learned, provably dissipative aerodynamic residual."
requires-python = ">=3.11"
dependencies = ["jax>=0.4.30", "numpy>=1.26"]

[project.optional-dependencies]
agent = ["anthropic>=2.8"]
track = ["mlflow>=2.14"]
viz = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["falcon", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
